name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check quality and security behaviors
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest
          python -m pip_audit --require-hashes -r requirements.lock
      - name: Detect OpenAPI contract drift
        run: |
          python scripts/export-contracts.py
          git diff --exit-code -- contracts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-${{ matrix.os }}
          path: artifacts/
          retention-days: 14
  integration:
    name: Container integration and security
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_IMAGE: trustpass-platform:ci
      GATEWAY_IMAGE: trustpass-gateway:ci
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Prepare verification environment
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python scripts/init-env.py
          docker compose config --quiet
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f
      - name: Build release images once
        run: |
          docker build --build-arg "SOURCE_REVISION=$SOURCE_REVISION" -t "$APP_IMAGE" .
          docker build --build-arg "SOURCE_REVISION=$SOURCE_REVISION" -f gateway/Dockerfile -t "$GATEWAY_IMAGE" .
      - name: Verify complete stack, restart and outage recovery
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          python scripts/e2e.py
      - name: Scan source and both images; export SBOM
        run: |
          mkdir -p artifacts/security
          scanner='aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969'
          docker run --rm -v "$PWD:/source:ro" "$scanner" fs --scanners secret --skip-dirs /source/.git --skip-files /source/.env --skip-dirs /source/.secrets --exit-code 1 /source
          for image in "$APP_IMAGE" "$GATEWAY_IMAGE"; do
            name=${image%%:*}
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy -v "$PWD/artifacts/security:/reports" "$scanner" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output "/reports/$name-vulnerabilities.json" "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/artifacts/security:/reports" "$scanner" image --format cyclonedx --output "/reports/$name-sbom.cdx.json" "$image"
          done
      - name: Save exact tested release images
        if: github.event_name != 'pull_request'
        run: docker save "$APP_IMAGE" "$GATEWAY_IMAGE" | gzip > artifacts/images.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event_name != 'pull_request'
        with:
          name: tested-images
          path: artifacts/images.tar.gz
          retention-days: 1
      - name: Collect diagnostics and stop CI stack
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose-logs.txt
          docker compose down --volumes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/*.json
            artifacts/*.txt
            artifacts/security/
          retention-days: 14
  publish:
    name: Publish verified images
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: tested-images, path: release}
      - name: Publish the exact images that passed integration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -dc release/images.tar.gz | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for component in platform gateway; do
            destination="$REGISTRY_IMAGE"
            if [ "$component" = gateway ]; then destination="$REGISTRY_IMAGE-gateway"; fi
            docker tag "trustpass-$component:ci" "$destination:sha-$COMMIT_SHA"
            docker tag "trustpass-$component:ci" "$destination:main"
            docker push "$destination:sha-$COMMIT_SHA"
            docker push "$destination:main"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$destination:sha-$COMMIT_SHA" | cut -d@ -f2)
            echo "${component^^}_DIGEST=$digest" >> "$GITHUB_ENV"
            echo "Published: \`$destination@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ env.PLATFORM_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}-gateway
          subject-digest: ${{ env.GATEWAY_DIGEST }}
          push-to-registry: true
      - name: End registry session
        if: always()
        run: docker logout ghcr.io
