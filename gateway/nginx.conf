worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
    server {
        listen 8080;
        server_tokens off;
        root /usr/share/nginx/html;
        client_max_body_size 16k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        limit_req_status 429;
        location = /health { return 200 '{"status":"ok"}'; }
        location /api/v1/credentials { limit_req zone=api burst=30 nodelay; proxy_pass http://issuer:8000; }
        location = /api/v1/verifications { limit_req zone=api burst=30 nodelay; proxy_pass http://verifier:8000; }
        location = /api/v1/events { limit_req zone=api burst=30 nodelay; proxy_pass http://audit:8000; }
        location = /.well-known/jwks.json { proxy_pass http://issuer:8000; }
        location = /contracts/issuer.json { proxy_pass http://issuer:8000/openapi.json; }
        location = /contracts/verifier.json { proxy_pass http://verifier:8000/openapi.json; }
        location = /contracts/audit.json { proxy_pass http://audit:8000/openapi.json; }
        location / { try_files $uri $uri/ =404; }
    }
}
